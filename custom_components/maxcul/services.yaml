enable_pairing:
  name: Add a MAX! device
  description: >-
    Start pairing first, then put only the device you want to add into pairing
    mode using its button or instructions. Nearby MAX! devices may also pair
    during this time. If you have one CUL, leave the connection field empty.
  fields:
    device_path:
      name: Which CUL should listen?
      description: >-
        Leave empty if you have one CUL. If you have more than one, enter the
        same path or network address used when setting up the CUL.
      example: "telnet://192.168.1.10:2323"
      selector:
        text:
    duration:
      name: How long should pairing stay open?
      description: The default is 30 seconds. Start pairing, then press the pairing button on your MAX! device during this time.
      default: 30
      selector:
        number:
          min: 1
          max: 300
          step: 1
          unit_of_measurement: seconds

set_week_profile:
  name: Set a thermostat's weekly schedule
  description: >-
    Send a complete seven-day heating schedule to a thermostat. This is an
    advanced setting. The schedule replaces the thermostat's current schedule.
  fields:
    device_id:
      name: Thermostat
      description: Choose the thermostat whose schedule you want to replace.
      selector:
        entity:
          filter:
            domain: climate
            device:
              integration: maxcul
    device_path:
      name: CUL connection (optional)
      description: >-
        Only fill this in if the same thermostat is connected through more than
        one CUL.
      example: "/dev/ttyUSB0"
      selector:
        text:
    week_profile:
      name: Heating schedule for all seven days
      description: >-
        Enter one line for each day. Each line starts with the day name, then
        alternates between a temperature and the time when the next temperature
        begins. Use temperatures from 4.5 to 30.5 °C in 0.5 °C steps and times
        in 5-minute steps. The example keeps 21 °C until 06:00, then 17 °C
        until 22:00, then 16 °C for the night.
      example: |-
        Mon 21,06:00,17,22:00,16
        Tue 21,06:00,17,22:00,16
        Wed 21,06:00,17,22:00,16
        Thu 21,06:00,17,22:00,16
        Fri 21,06:00,17,22:00,16
        Sat 21,08:00,17,23:00,16
        Sun 21,08:00,17,23:00,16
      selector:
        text:
          multiline: true

associate:
  name: Link a thermostat to a window contact
  description: >-
    Make the thermostat lower its temperature when this window is open. Choose
    the thermostat and its window contact, then call this service. Afterward,
    open or close the window once so the contact wakes up. Do not press the
    pairing button on the back of the contact.
  fields:
    thermostat_id:
      name: Thermostat
      description: Choose the thermostat in the room with this window.
      selector:
        entity:
          filter:
            domain: climate
            device:
              integration: maxcul
    window_contact_id:
      name: Window or door contact
      description: Choose the contact mounted on the window or door.
      selector:
        entity:
          filter:
            domain: binary_sensor
            device_class: window
            device:
              integration: maxcul
    device_path:
      name: CUL connection (optional)
      description: >-
        Only fill this in if these devices are connected through more than one
        CUL.
      example: "/dev/ttyUSB0"
      selector:
        text:

deassociate:
  name: Unlink a thermostat and window contact
  description: >-
    Stop this window contact from changing the thermostat's temperature.
    Choose the thermostat and contact that are currently linked. If the change
    does not take effect immediately, open or close the window once to wake the
    contact.
  fields:
    thermostat_id:
      name: Thermostat
      description: Choose the thermostat that is currently linked to the contact.
      selector:
        entity:
          filter:
            domain: climate
            device:
              integration: maxcul
    window_contact_id:
      name: Window or door contact
      description: Choose the contact that is currently linked to the thermostat.
      selector:
        entity:
          filter:
            domain: binary_sensor
            device_class: window
            device:
              integration: maxcul
    device_path:
      name: CUL connection (optional)
      description: >-
        Only fill this in if these devices are connected through more than one
        CUL.
      example: "/dev/ttyUSB0"
      selector:
        text:
